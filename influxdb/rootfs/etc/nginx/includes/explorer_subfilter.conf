sub_filter_once off;
sub_filter_types text/css application/javascript text/javascript application/x-javascript;
sub_filter '<base href="/">' '<base href="%%ingress_entry%%/">';
sub_filter '<head>' '<head><base href="%%ingress_entry%%/">';
sub_filter 'href="/' 'href="%%ingress_entry%%/';
sub_filter 'src="/' 'src="%%ingress_entry%%/';
sub_filter '"/api/' '"%%ingress_entry%%/api/';
sub_filter "'/api/" "'%%ingress_entry%%/api/";
# Explorer loads its Terms document from the web root; keep the request within ingress.
sub_filter 'fetch("/license.txt")' 'fetch("license.txt")';
# Explorer's pinned bundle does not derive its router basename from <base>.
sub_filter 'es=(0,s.Ys)(el)' 'es=(0,s.Ys)(el,{basename:new URL(document.baseURI).pathname.slice(0,-1)||"/"})';
