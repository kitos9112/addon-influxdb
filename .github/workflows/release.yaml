---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'kitos9112/addon-influxdb'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(ruby tests/check-release-contract.rb influxdb/config.yaml "$RELEASE_TAG")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Verify tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  github-release:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "InfluxDB 3 ${RELEASE_TAG#v}"
